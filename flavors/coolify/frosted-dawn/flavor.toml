name = "Frosted Dawn"
summary = "The new sections of Coolify as floating islands of frosted glass over a warm peach wallpaper, with a terracotta brand colour."
about = [
  "Frosted Dawn puts a frosted wallpaper of soft peach waves behind Coolify and turns each part of the page into its own floating island of frosted glass: the sidebar, the top bar, the content, each settings section, the page headings and the modals. The same gap separates all the islands, and all cards, tables and fields use one set of glass colours, in dark mode and in light mode.",
  "It changes the look only: nothing moves, nothing is added, and Coolify's own pages and controls stay as they are. Coolify's purple becomes a warm terracotta in every place that it shows, from buttons and links to focus rings and the active sidebar item. If you turn on Coolify's custom theme or its floating navigation, the flavor steps aside.",
  "It runs on coolify.shadowarcanist.com as it ships. To use it on your own instance, change the @match line to the address of your Coolify. The wallpaper, its dim and blur, and the island gap and radius are settings at the top of the script.",
]

tags = ["dark", "light", "glass", "orange"]
screenshots = [
